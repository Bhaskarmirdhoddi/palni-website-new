<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Palni | Salesforce, ServiceNow and Databricks</title>
    <meta name="description" content="Palni helps enterprises improve customer and revenue operations with Salesforce, streamline workflows with ServiceNow, and build trusted data solutions with Databricks." />
    <meta name="theme-color" content="#070D1C" />
    <script>
      try {
        var t = localStorage.getItem('palni-theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url(/assets/fonts/space-grotesk.woff2) format("woff2");
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
      }
      html, body { background: #070D1C; color: #EEF2FA; margin: 0; }
      html[data-theme=light], html[data-theme=light] body { background: #F4F5F9; color: #0E162C; }
    </style>
    <link rel="preload" href="/assets/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
